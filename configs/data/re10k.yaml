data:
  root: datasets/re10k
  stage: train
  image_size: [224, 224]
  original_image_size: [360, 640]
  num_context_views: 2
  num_target_views: 4
  min_context_gap: 45
  max_context_gap: 90
  initial_min_context_gap: 25
  initial_max_context_gap: 25
  context_gap_warmup_steps: 37500
  min_target_distance: 0
  baseline_min: 1.0e-3
  baseline_max: 1.0e10
  max_fov: 100.0
  make_baseline_one: true
  relative_pose: true
  augment: true
  skip_bad_shape: true
  seed: 42
