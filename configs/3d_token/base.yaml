model:
  class_name: model.mvp_3d_token.MVP3DTokenModel

  backbone:
    class_name: model.backbones.mvp.backbone.MVPBackbone
    config_path: configs/mvp/inference.yaml
    freeze: true

  decoder:
    token_dim: 1024
    position_range: 4.0

    attention:
      num_heads: 16
      mlp_ratio: 4.0
      dropout: 0.0
      query_chunk_size: 256
      evidence_chunk_size: 1024
      slot_epsilon: 1.0e-8
      slot_null: true

    initializer:
      num_queries: 2048
      layers:
        - type: cross
        - type: slot

    split:
      enabled: false
      dense: true
      threshold: 0.5

    refinement:
      layers: []

  gaussians:
    sh_degree: 1
    near_plane: 0.01
    far_plane: 1000000.0
    scale_bias: -6.9
    scale_max: -1.2
    opacity_bias: -2.0

loss:
  mse:
    weight: 1.0
  lpips:
    weight: 0.05
    apply_after_step: 0
  initial_render_weight: 1.0
  split_score_weight: 0.1

wandb:
  project: 3D_Token_MVP
  mode: online
  tags: [posed, mvp, 3d-token]

data:
  data_path: data/dl3dv_train.txt
  json_path: data/dl3dv_fold_8_kmeans_input_idx.json
  seed: 42
  resize_h: 544
  square_crop: false
  random_crop: 0.77
  input_frame_select_type: uniform
  target_frame_select_type: random
  num_input_frames: 32
  num_target_frames: 6
  target_has_input: true
  min_frame_dist: all
  max_frame_dist: 128
  shuffle_input_prob: 0.0
  reverse_input_prob: 0.5

training:
  num_views: [32]
  target_views: [6]
  res_dict: [[544, 960]]
  dataset_name: data.dataset.Dataset
  use_amp: true
  use_tf32: true
  amp_dtype: bf16
  chunk_size: 4
  api_key_path: ./configs/api_keys.yaml
  batch_size_per_gpu: [1]
  warmup: 3000
  weight_decay: 0.05
  beta1: 0.9
  beta2: 0.95
  lr: 0.0002
  train_steps: 100000
  checkpoint_every: 5000
  grad_accum_steps: 1
  gradient_clip_norm: 0.5
  num_threads: 8
  num_workers: 4
  prefetch_factor: 4
  print_every: 20
  wandb_log_every: 50
  image_log_every: 500

evaluation:
  checkpoint_path: ./experiments/checkpoints/3d_token_full
  max_batches: 50
