model:
  class_name: model.mvp_3d_token.MVP3DTokenModel

  backbone:
    class_name: model.backbones.mvp.backbone.MVPBackbone
    config_path: configs/mvp/inference.yaml
    freeze: true

  decoder:
    token_dim: 1024
    geometry_dim: 128
    position_anchor: [0.0, 0.0, 1.0]

    attention:
      num_heads: 16
      mlp_ratio: 4.0
      dropout: 0.0
      query_chunk_size: 256
      evidence_chunk_size: 1024
      slot_epsilon: 1.0e-8
      slot_null: true

    initializer:
      num_queries: 2048
      layers:
        - type: cross
        - type: slot

    split:
      enabled: false
      dense: true
      threshold: 0.5

    refinement:
      layers: []

  gaussians:
    sh_degree: 0
    near_plane: 0.01
    far_plane: 1000000.0
    background_color: [0.0, 0.0, 0.0]
    scale_min: 1.0e-6
    scale_max: 1.0
    scale_bias: -4.0
    opacity_bias: 0.0
    opacity_mapping:
      initial: 0.0
      final: 0.0
      warm_up: 1
    low_pass_filter: 10.0
    low_pass_filter_min: 0.3
    decrease_lpf_step: 1000
    decrease_lpf_factor: 3.0

loss:
  mse:
    weight: 1.0
  lpips:
    weight: 0.05
    apply_after_step: 0
  visibility:
    weight: 1.0
    clip: 1.0
  scale_regularization:
    weight: 1.0
    threshold: 0.1
  initial_render_weight: 1.0
  split_score_weight: 0.1

wandb:
  project: 3D_Token_MVP
  mode: online
  tags: [posed, mvp, 3d-token]

visualization:
  projection_resolution: 256
  projection_margin: 0.1
  projection_fov_degrees: 10.0

training:
  use_amp: true
  use_tf32: true
  amp_dtype: bf16
  chunk_size: 4
  api_key_path: ./configs/api_keys.yaml
  warmup: 3000
  weight_decay: 0.05
  beta1: 0.9
  beta2: 0.95
  lr: 0.0002
  backbone_lr_multiplier: 0.01
  train_steps: 100000
  checkpoint_every: 5000
  grad_accum_steps: 1
  gradient_clip_norm: 0.5
  num_threads: 8
  print_every: 20
  wandb_log_every: 50
  image_log_every: 500

evaluation:
  checkpoint_path: ./experiments/checkpoints/3d_token_full
  max_batches: 50
