model:
  class_name: model.mvp_3d_token.MVP3DTokenModel
  feature_extractor_only: true

  patch_factor: 2
  dim1: 256
  dim2: 512
  dim3: 1024
  num_register_tokens: 4
  head_dim: 64
  inter_multi: 4
  qk_norm: true
  stage1_nlayer: 2
  stage2_nlayer: 4
  stage3_nlayer: 8
  group_size: 4
  patch_size: 8
  in_channels: 12

  backbone:
    class_name: model.backbones.mvp.frozen.FrozenMVPBackbone
    checkpoint_path: ./mvp.pt

  decoder:
    token_dim: 1024
    num_queries: 2048
    num_heads: 16
    init_layers: 2
    mlp_ratio: 4.0
    position_range: 4.0
    split:
      enabled: false
      dense: true
      threshold: 0.5
    refinement:
      num_layers: 0

  gaussians:
    sh_degree: 1
    opacity_degree: 2
    near_plane: 0.01
    far_plane: 1000000.0
    scale_bias: -6.9
    scale_max: -1.2
    opacity_bias: -2.0

data:
  data_path: data/dl3dv_train.txt
  json_path: data/dl3dv_fold_8_kmeans_input_idx.json
  resize_h: 544
  square_crop: false
  random_crop: 0.77
  input_frame_select_type: uniform
  target_frame_select_type: random
  num_input_frames: 32
  num_target_frames: 6
  target_has_input: true
  min_frame_dist: all
  max_frame_dist: 128
  shuffle_input_prob: 0.0
  reverse_input_prob: 0.5

training:
  dataset_name: data.dataset.Dataset
  use_amp: true
  use_tf32: true
  amp_dtype: bf16
  chunk_size: 4
  api_key_path: ./configs/api_keys.yaml
  batch_size_per_gpu: 1
  warmup: 3000
  weight_decay: 0.05
  beta1: 0.9
  beta2: 0.95
  lr: 0.0002
  train_steps: 100000
  checkpoint_dir: ./experiments/checkpoints/3d_token_e00
  checkpoint_every: 5000
  grad_accum_steps: 1
  l2_loss_weight: 1.0
  lpips_loss_weight: 0.0
  perceptual_loss_weight: 0.2
  initial_render_loss_weight: 1.0
  split_score_loss_weight: 0.1
  num_threads: 8
  num_workers: 4
  prefetch_factor: 4
  print_every: 20
  wandb_exp_name: 3D_Token_MVP_E00
  wandb_log_every: 50
  wandb_project: 3D_Token_MVP

evaluation:
  checkpoint_path: ./experiments/checkpoints/3d_token_e00
  max_batches: 50
